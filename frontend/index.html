<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SprintLite - Task Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assignment+Turned+In&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Navigation Bar -->
        <nav class="navbar" id="navbar" style="display: none;">
            <div class="nav-brand">
                <i class="fas fa-layer-group"></i> SprintLite
            </div>
            <div class="nav-links">
                <a href="#dashboard" class="nav-item active"><i class="fas fa-home"></i> Dashboard</a>
                <div class="user-menu">
                    <span id="user-name">User</span>
                    <button id="logout-btn" class="btn-text"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Content will be injected here by router -->
        </main>

        <!-- Toast Notification Container -->
        <div id="toast-container"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
